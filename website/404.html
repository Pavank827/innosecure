<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InnoSecure — Page not found</title>
  <meta http-equiv="refresh" content="0; url=../">
  <script>
    // Redirect every unknown path to the GitHub Pages site root.
    // The site is served at /<repo>/ so keep the first path segment only.
    (function () {
      var p = location.pathname.split('/');
      p.splice(2, p.length - 2);
      location.replace(location.origin + p.join('/') + '/');
    })();
  </script>
</head>
<body style="margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f7f8fa;color:#1a1f2e;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;">
  <div>
    <h1 style="font-size:22px;font-weight:600;margin:0 0 8px;">Redirecting to InnoSecure…</h1>
    <p style="font-size:14px;color:#5b6474;margin:0 0 16px;">This path does not exist on the live site.</p>
    <a href="../" style="font-size:14px;color:#2563eb;font-weight:600;text-decoration:none;">Go to the website</a>
  </div>
</body>
</html>
